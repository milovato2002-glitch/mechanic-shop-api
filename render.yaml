services:
  - type: web
    name: mechanic-shop-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn flask_app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mechanic-shop-db
          property: connectionString

databases:
  - name: mechanic-shop-db
    plan: free
